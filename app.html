<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your workspace · Causvia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23D4AF37'/%3E%3Cstop offset='.5' stop-color='%23F59E0B'/%3E%3Cstop offset='.78' stop-color='%230EA5A8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M72.6 32.4A32 32 0 1 0 72.6 77.6' fill='none' stroke='url(%23g)' stroke-width='16' stroke-linecap='round'/%3E%3Ccircle cx='86' cy='52' r='7' fill='%23D4AF37'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/causvia-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/app/app.css">
</head>
<body>
  <main class="ws" id="ws" aria-busy="true">
    <div class="ws-card">
      <picture><source srcset="/causvia-mark.webp" type="image/webp"><img class="ws-mark" src="/causvia-mark.png" alt="" width="400" height="293"></picture>
      <img class="ws-word" src="/causvia-wordmark.png" alt="Causvia" width="137" height="13">
      <div class="ws-load" id="wsLoad" role="status"><span class="spin" aria-hidden="true"></span>Opening your workspace…</div>
      <div id="wsBody" hidden>
        <h1 id="wsHello">Welcome</h1>
        <p>Your workspace is being set up. Your Causvia contact will walk you through your first experiment.</p>
        <button class="btn" type="button" id="wsOut"><span class="spin" aria-hidden="true"></span><span>Sign out</span></button>
      </div>
      <p class="ws-err" id="wsErr" role="alert" hidden></p>
    </div>
    <p class="ws-foot"><i aria-hidden="true"></i>Doubted before trusted · Early access</p>
  </main>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
